# Netlify Monorepo Configuration for LUXURY WATCH
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Ensure JS modules are served with the correct MIME type
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback & API proxy to production Render backend
[[redirects]]
  from = "/api/*"
  to = "https://luxury-watch-vibr.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "https://luxury-watch-vibr.onrender.com/uploads/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
